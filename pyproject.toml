[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgequorum"
version = "0.2.1"
description = "ForgeQuorum: multi-agent engineering teams and reusable skills for Codex"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Dimash Janibekov"}]
keywords = ["codex", "gpt", "multi-agent", "skills", "ai", "developer-tools"]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Operating System :: OS Independent"]

[project.scripts]
forgequorum = "forgequorum.cli:main"
fq = "forgequorum.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
